name: Build ARM64 release image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: ghcr.io/molakesizhanfangguangmang/streamforge

jobs:
  release-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 OCI image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          outputs: type=oci,dest=/tmp/streamforge-arm64.oci.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compress image archive
        run: zstd -T0 -19 /tmp/streamforge-arm64.oci.tar -o /tmp/streamforge-arm64.oci.tar.zst
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: /tmp/streamforge-arm64.oci.tar.zst
