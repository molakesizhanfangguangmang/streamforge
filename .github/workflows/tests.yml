name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run offline tests
        run: |
          set -e
          for file in test_*.py; do
            echo "=== $file"
            python3 "$file"
          done
          for file in test_*.sh; do
            echo "=== $file"
            sh "$file"
          done
